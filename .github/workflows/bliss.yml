name: Build BlissOS Kernel with KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build x86_64 Kernel (KSU-Next + NoMount)
    runs-on: ubuntu-22.04
    steps:
      - name: Build BlissOS Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/yeasin0423/kernel_common
          kernel-branch: umbral-20230329-nksu
          config: android-x86_64_defconfig
          arch: x86
          aosp-clang: true
          aosp-gcc: true
          aosp-clang-version: r596125
          ksu: true
          ksu-other: true
          ksu-url: https://github.com/KernelSU-Next/KernelSU-Next
          ksu-version: v3.4.2
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
